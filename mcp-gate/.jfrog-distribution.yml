# Lists the artifacts bundled into a signed release bundle and mirrored to releases.jfrog.io. Read by .github/workflows/release-mcp-gate.yml.
# <VERSION> is filled in at runtime from the workflow's `version:` input

artifacts:
  # Versioned install package (immutable).
  - type: generic
    path: jfrog-mcp-gate/v<VERSION>/mcp-gate-<VERSION>.tgz
    target:
      repository: jfrog-cli-plugins

  # Top-level files (overwritten each release - what IT downloads).
  - type: generic
    path: jfrog-mcp-gate/install.sh
    target:
      repository: jfrog-cli-plugins
  - type: generic
    path: jfrog-mcp-gate/uninstall.sh
    target:
      repository: jfrog-cli-plugins
  - type: generic
    path: jfrog-mcp-gate/install.ps1
    target:
      repository: jfrog-cli-plugins
  - type: generic
    path: jfrog-mcp-gate/uninstall.ps1
    target:
      repository: jfrog-cli-plugins
  - type: generic
    path: jfrog-mcp-gate/com.jfrog.mcp-gate.mobileconfig
    target:
      repository: jfrog-cli-plugins
  - type: generic
    path: jfrog-mcp-gate/LATEST
    target:
      repository: jfrog-cli-plugins
