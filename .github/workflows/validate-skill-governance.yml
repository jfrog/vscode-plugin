name: Validate skill governance

on:
  pull_request:
    branches: [main]
    paths:
      # Governance lives entirely in agent-guard, so the wiring IS the hooks file. The
      # plugin/scripts/** glob stays so that adding any plugin-side governance code re-triggers
      # the validator that asserts it must not exist.
      - "plugin/hooks/hooks.json"
      - "plugin/scripts/**"
      - "plugin/modules/**"
      - "plugin/.claude-plugin/plugin.json"
      - "marketplace.json"
      - "scripts/validate-skill-governance.mjs"
      - ".github/workflows/validate-skill-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skill governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Hermetic: no network and no JFrog credentials. Every governed call runs against a stub
      # npx, so the fail-open and fail-closed paths are exercised without reaching a registry.
      - name: Run skill-governance validation
        run: node scripts/validate-skill-governance.mjs
