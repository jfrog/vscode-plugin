# Tags a release for the Claude Code marketplace.
#
# What this workflow does, in order:
#   1. Clones the current `main` (which is skill-free — see .gitignore).
#   2. Pulls skill content from jfrog/jfrog-skills@<pin> into plugin/skills/.
#   3. Reads the version from marketplace.json (already bumped in a PR).
#   4. Creates a detached commit, tags it v<version>, and pushes only the
#      tag. `main` itself is never modified by CI.
#   5. Publishes a GitHub Release pointing at the tag.
#
# To trigger: Actions → "Release plugin" → Run workflow. No inputs needed.

name: Release plugin

on:
  workflow_dispatch:

permissions:
  # Needed so the workflow can push the new tag and create the release.
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Check out main
      # Shallow clone is enough: we never look at past commits, we only
      # add a new one on a detached HEAD further down.
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main

      # Install Node
      # Needed for the sync script and for reading marketplace.json in
      # the "Resolve release tag" step.
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      # Vendor the skills from upstream
      # Downloads the upstream tarball at the pin declared in
      # plugin/.vendor.json (e.g. jfrog/jfrog-skills@v0.11.0) and copies
      # its skill folders into plugin/skills/. This is the only change
      # to the working tree before we commit.
      - name: Sync skills from upstream
        run: node .github/scripts/sync-skills.mjs

      # Read the release version from marketplace.json
      # The version is bumped in a normal PR before triggering this
      # workflow; the workflow itself never edits files. Fails if the
      # marketplace has no plugins, a missing version, or plugins with
      # mismatched versions.
      - name: Resolve release tag
        run: |
          VERSION=$(node -e '
            const plugins = require("./marketplace.json").plugins ?? [];
            const versions = [...new Set(plugins.map(p => p?.version))];
            if (versions.length !== 1 || !versions[0]) process.exit(1);
            console.log(versions[0]);
          ')
          if [ -z "$VERSION" ]; then
            echo "::error::marketplace.json must list at least one plugin and all plugins must share the same non-empty version"
            exit 1
          fi
          echo "TAG=v${VERSION}" >> "$GITHUB_ENV"

      # Create a detached commit, tag, and push the tag
      # `git checkout --detach` lets us commit without moving `main`.
      # We push only the tag (`origin <TAG>`), so the synced skills
      # live exclusively on the release tag.
      #
      # If the version on main was never bumped, `git push` rejects the
      # tag as "already exists" — clean failure, no force push.
      - name: Tag the release
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --detach
          git add -A
          git commit -m "Release ${TAG}"
          git tag "${TAG}"
          git push origin "${TAG}"

      # Publish a GitHub Release
      # `--generate-notes` asks GitHub to auto-write release notes from
      # the PRs merged since the previous tag.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${TAG}" --title "${TAG}" --generate-notes
