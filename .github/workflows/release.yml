name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Full history (and therefore tags) so the "already released" check below can see them.
      # No write token needed: nothing here pushes over git, the release API creates the tag.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Releasing is opt-in: only a merge whose commit *subject* carries [major], [minor] or
      # [patch] cuts one. The marker is purely a trigger — the version itself always comes from
      # the manifest, so the bump is reviewable in the PR that makes it.
      # Subject line only, deliberately. This repo squash-merges, and GitHub pre-fills the squash
      # message body from the branch's commit messages (or the PR description). Either one can
      # mention a marker while merely documenting it — matching the whole message would then
      # release by accident on a merge nobody intended as a release.
      # The message is passed through env rather than interpolated into the script, so a commit
      # subject can never inject shell.
      - name: Detect release marker in commit subject
        id: detect
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          SUBJECT=$(printf '%s\n' "$MSG" | head -1)
          if printf '%s' "$SUBJECT" | grep -qE '\[(major|minor|patch)\]'; then
            echo "triggered=true" >> "$GITHUB_OUTPUT"
          else
            echo "triggered=false" >> "$GITHUB_OUTPUT"
          fi

      # plugin/.claude-plugin/plugin.json is the canonical version for the plugin itself.
      # marketplace.json carries its own copy for the marketplace listing, so the two are
      # cross-checked here as well as by the validate-version PR check — a release is the last
      # place a mismatch should get through.
      - name: Read version from the plugin manifest
        if: steps.detect.outputs.triggered == 'true'
        id: version
        run: |
          set -euo pipefail
          VERSION=$(jq -er '.version' plugin/.claude-plugin/plugin.json)
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::plugin.json version '$VERSION' is not X.Y.Z — refusing to release"
            exit 1
          fi
          MARKET_VERSION=$(jq -er '.plugins[] | select(.name == "jfrog") | .version' marketplace.json)
          if [ "$VERSION" != "$MARKET_VERSION" ]; then
            echo "::error::plugin.json is $VERSION but marketplace.json lists $MARKET_VERSION — sync them before releasing"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Catches the one mistake this flow allows: merging a release marker without bumping the
      # manifests. The tag is created as part of the release below, so a tag that already exists
      # means that version genuinely shipped.
      - name: Refuse to re-release an existing version
        if: steps.detect.outputs.triggered == 'true'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists — bump the plugin manifests before merging a release marker"
            exit 1
          fi

      # NOTE: this repo has no plugin-layout validator to gate the release on. The manifest
      # cross-check above is all there is. If a validator lands here, run it as a step at this
      # point so a bad layout can't be released.
      # git archive exports tracked files at HEAD, so nothing an earlier step happened to leave on
      # the runner can end up in the artifact. .github is excluded to match what users get.
      - name: Package release artifact
        if: steps.detect.outputs.triggered == 'true'
        run: git archive --format=zip --output=release.zip HEAD -- ':(exclude).github'

      # --target creates the tag as part of creating the release, in a single API call. Pushing the
      # tag separately beforehand meant a failure in between left an orphan tag with no release, and
      # the re-run then tripped the "already exists" check above with nothing wrong but the tag.
      - name: Create GitHub Release
        if: steps.detect.outputs.triggered == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            release.zip \
            --target "$GITHUB_SHA" \
            --title "Release v${{ steps.version.outputs.version }}" \
            --generate-notes
