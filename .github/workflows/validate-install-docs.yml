name: Validate install docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Validate install/recovery docs
        run: |
          node --test scripts/validate-install-docs.test.mjs
          JFROG_PLUGIN_HARNESS=vscode node scripts/validate-install-docs.mjs
