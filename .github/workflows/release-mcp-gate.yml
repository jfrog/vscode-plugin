# Release jfrog-mcp-gate to Artifactory.
# Edge path: releases.jfrog.io/jfrog-cli-plugins/jfrog-mcp-gate/...
#
# Prereqs (one-time, by JFrog CI infra):
#   - Org GitHub vars JF_URL, JF_OIDC_PROVIDER, JF_OIDC_AUDIENCE.
#   - Service "jfrog-mcp-gate" (short "jfmcpg") registered with
#     next-gen-ci-pre-build under project jfml.

name: Release jfrog-mcp-gate

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.1). Reads mcp-gate/VERSION if empty.'
        required: false
        type: string
      promote_to_latest:
        description: 'Also copy this version into jfrog-cli-plugins/jfrog-mcp-gate/latest/ on releases.jfrog.io.'
        required: false
        default: true
        type: boolean

concurrency:
  group: jfrog-mcp-gate-release
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  JF_URL: ${{ vars.JF_URL }}
  JF_OIDC_PROVIDER: ${{ vars.JF_OIDC_PROVIDER }}
  JF_OIDC_AUDIENCE: ${{ vars.JF_OIDC_AUDIENCE }}
  JF_PROJECT: jfml

jobs:
  # 1. Pre-Build: resolve dev generic repo + build metadata.
  pre-build:
    name: Pre-Build
    runs-on: devf-dind-amd-scale-set
    timeout-minutes: 15
    outputs:
      metadata: ${{ steps.pre-build.outputs.metadata }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Generate build metadata
        id: pre-build
        uses: JFROG/next-gen-ci-pre-build@v6.0.1
        with:
          project: jfml
          service-name: jfrog-mcp-gate
          short-service-name: jfmcpg
          generic: "true"
          validate-dev-repos: "true"
          dev-repos-timeout-minutes: "10"
          dev-repos-check-interval-seconds: "10"
          debug: "true"

  # 2. Build & Upload: tar bin/+lib/+VERSION, push to dev generic on entplus.
  build-and-upload:
    name: Build & Upload
    needs: pre-build
    runs-on: devf-dind-amd-scale-set
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      TARGET_REPO: ${{ fromJSON(needs.pre-build.outputs.metadata).repositories.generic.deploy }}
      BUILD_NAME: ${{ fromJSON(needs.pre-build.outputs.metadata).service_name }}-release-${{ fromJSON(needs.pre-build.outputs.metadata).build_type }}
      BUILD_NUMBER: ${{ fromJSON(needs.pre-build.outputs.metadata).build_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Resolve version
        id: version
        run: |
          set -e
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(cat mcp-gate/VERSION)"
          fi
          VERSION="${VERSION#v}"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing jfrog-mcp-gate version: ${VERSION}"

      - name: Install build tools
        id: install-tools
        uses: JFROG/install-tools@master
        with:
          install-ngci: 'true'

      - name: Build install package
        run: |
          set -e
          cd mcp-gate
          mkdir -p dist
          TGZ="mcp-gate-${VERSION}.tgz"
          tar -czf "dist/${TGZ}" bin lib VERSION
          echo "${VERSION}" > dist/LATEST
          ls -la dist/

      - name: Upload artefacts to Artifactory
        env:
          JF_ACCESS_TOKEN: ${{ steps.install-tools.outputs.oidc-token }}
        run: |
          set -e
          BASE="${TARGET_REPO}/jfrog-mcp-gate"

          echo "==> Versioned install package -> ${BASE}/v${VERSION}/"
          jfrog rt upload --fail-no-op --quiet --flat=true \
            --build-name="${BUILD_NAME}" \
            --build-number="${BUILD_NUMBER}" \
            --project="${JF_PROJECT}" \
            "mcp-gate/dist/mcp-gate-${VERSION}.tgz" "${BASE}/v${VERSION}/"

          echo "==> Top-level artefacts -> ${BASE}/"
          for f in install.sh uninstall.sh install.ps1 uninstall.ps1 com.jfrog.mcp-gate.mobileconfig; do
            jfrog rt upload --fail-no-op --quiet --flat=true \
              --build-name="${BUILD_NAME}" \
              --build-number="${BUILD_NUMBER}" \
              --project="${JF_PROJECT}" \
              "mcp-gate/${f}" "${BASE}/${f}"
          done
          jfrog rt upload --fail-no-op --quiet --flat=true \
            --build-name="${BUILD_NAME}" \
            --build-number="${BUILD_NUMBER}" \
            --project="${JF_PROJECT}" \
            "mcp-gate/dist/LATEST" "${BASE}/LATEST"

      - name: Publish build info
        env:
          JF_ACCESS_TOKEN: ${{ steps.install-tools.outputs.oidc-token }}
        run: |
          set -e
          jfrog rt build-publish \
            "${BUILD_NAME}" \
            "${BUILD_NUMBER}" \
            --project="${JF_PROJECT}"

  # 3. Post-Build: wrap the uploaded build in a signed release bundle and
  # promote it to the "release" environment.
  post-build:
    name: Post-Build
    needs: [pre-build, build-and-upload]
    runs-on: devf-dind-amd-scale-set
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Promote release artefacts
        uses: JFROG/next-gen-ci-post-build@v3.3.0
        with:
          # Manual mode (no `metadata:`) keeps a fixed bundle name across
          # re-dispatches; new versions just stack on top of the same bundle.
          bundle-name: jfrog-mcp-gate-release
          version: ${{ needs.build-and-upload.outputs.version }}
          project: ${{ env.JF_PROJECT }}
          builds: '[{"name":"jfrog-mcp-gate-release","number":"${{ fromJSON(needs.pre-build.outputs.metadata).build_number }}"}]'
          target-environment: release
          create-final-tag: 'false'

  # 4. Distribute: mirror to releases.jfrog.io/jfrog-cli-plugins/.
  distribute:
    name: Distribute to release edges
    needs: [pre-build, build-and-upload, post-build]
    runs-on: devf-dind-amd-scale-set
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Distribute jfrog-mcp-gate to release edges
        uses: JFROG/next-gen-ci-distribution@v2.3.0
        with:
          metadata: ${{ needs.pre-build.outputs.metadata }}
          service: jfrog-mcp-gate
          version: ${{ needs.build-and-upload.outputs.version }}
          project: jfml
          distribution-type: onprem
          distribution-manifest: mcp-gate/.jfrog-distribution.yml
          # Package is plain text/JS - skip Xray scan + clamav to keep
          # the run fast. Build-info evidence is still attached.
          skip-scan: 'true'
          skip-clamav: 'true'

  # 5. Promote to "latest" on releases.jfrog.io (opt-in, default ON).
  promote-latest:
    name: Promote to latest on releases.jfrog.io
    if: ${{ inputs.promote_to_latest == true }}
    needs: [build-and-upload, post-build, distribute]
    runs-on: devf-dind-amd-scale-set
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.build-and-upload.outputs.version }}
      RELEASES_URL: https://releases.jfrog.io/artifactory/
    steps:
      - name: Install build tools
        id: install-tools
        uses: JFROG/install-tools@master
        with:
          install-ngci: 'true'

      - name: Copy versioned install package to latest/ on releases.jfrog.io
        env:
          JF_ACCESS_TOKEN: ${{ steps.install-tools.outputs.oidc-token }}
        run: |
          set -e
          echo "Copying v${VERSION} to latest/ on releases.jfrog.io..."
          jf rt cp --fail-no-op \
            "jfrog-cli-plugins/jfrog-mcp-gate/v${VERSION}/(*)" \
            "jfrog-cli-plugins/jfrog-mcp-gate/latest/{1}" \
            --url="${RELEASES_URL}" \
            --access-token="${JF_ACCESS_TOKEN}"
          echo "Done."
